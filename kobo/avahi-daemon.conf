# Minimal avahi-daemon config for kobo/debug-network-init.sh
# (KOBO_DEBUG_NET=y builds only): publishes the device as lk8000.local
# on the USB gadget link (usb0), nothing else. Installed to
# /opt/LK8000/etc/avahi-daemon.conf and passed to avahi-daemon via
# --file=, since the device has no /etc/avahi of its own and the daemon
# is launched via our own bundled ld.so rather than a system-installed
# one -- see debug-network-init.sh for the invocation.

[server]
host-name=lk8000
domain-name=local
use-ipv4=yes
use-ipv6=no
allow-interfaces=usb0
# We only need mDNS hostname publishing, not the D-Bus control API (no
# client app talks to avahi-daemon here) -- and there's no D-Bus system
# bus running by default on this device (see debug-network-init.sh's
# BLUETOOTH section, which only starts one when USE_BLE testing needs
# it). Without this, avahi-daemon's default enable-dbus=yes fails
# *fatally* (not just a warning) when it can't reach
# /run/dbus/system_bus_socket -- confirmed on real hardware.
enable-dbus=no

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]
enable-reflector=no
